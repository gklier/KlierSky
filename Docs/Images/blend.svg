<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="t d">
<title id="t">How the KlierSky blend weighs its sources</title>
<desc id="d">Illustration of the starting weights used when all ten sources answer. Foreca counts most. These are a fixed ranking, not measured reliability.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1b2a"/><stop offset="1" stop-color="#08121d"/></linearGradient><linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4aa8f0"/><stop offset="1" stop-color="#6fe0c8"/></linearGradient></defs>
<rect width="1280" height="560" rx="28" fill="url(#bg)"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" fill="#eaf2fa">
<text x="48" y="70" font-size="30" font-weight="600">Many sources, one forecast</text>
<text x="48" y="104" font-size="17" fill="#9fb3c8">Each hourly value is the weighted average of the sources that supplied it. Starting weights when all ten answer.</text>
<text x="284" y="169" font-size="17" text-anchor="end">Foreca</text>
<rect x="300" y="152" width="640" height="24" rx="12" fill="#ffffff" fill-opacity="0.07"/>
<rect x="300" y="152" width="640" height="24" rx="12" fill="url(#bar)"/>
<text x="952" y="170" font-size="15" fill="#9fb3c8">18%</text>
<text x="284" y="203" font-size="17" text-anchor="end">NWS (US only)</text>
<rect x="300" y="186" width="640" height="24" rx="12" fill="#ffffff" fill-opacity="0.07"/>
<rect x="300" y="186" width="427" height="24" rx="12" fill="url(#bar)"/>
<text x="739" y="204" font-size="15" fill="#9fb3c8">12%</text>
<text x="284" y="237" font-size="17" text-anchor="end">Open-Meteo</text>
<rect x="300" y="220" width="640" height="24" rx="12" fill="#ffffff" fill-opacity="0.07"/>
<rect x="300" y="220" width="427" height="24" rx="12" fill="url(#bar)"/>
<text x="739" y="238" font-size="15" fill="#9fb3c8">12%</text>
<text x="284" y="271" font-size="17" text-anchor="end">ECMWF</text>
<rect x="300" y="254" width="640" height="24" rx="12" fill="#ffffff" fill-opacity="0.07"/>
<rect x="300" y="254" width="427" height="24" rx="12" fill="url(#bar)"/>
<text x="739" y="272" font-size="15" fill="#9fb3c8">12%</text>
<text x="284" y="305" font-size="17" text-anchor="end">MET Norway</text>
<rect x="300" y="288" width="640" height="24" rx="12" fill="#ffffff" fill-opacity="0.07"/>
<rect x="300" y="288" width="320" height="24" rx="12" fill="url(#bar)"/>
<text x="632" y="306" font-size="15" fill="#9fb3c8">9%</text>
<text x="284" y="339" font-size="17" text-anchor="end">DWD ICON</text>
<rect x="300" y="322" width="640" height="24" rx="12" fill="#ffffff" fill-opacity="0.07"/>
<rect x="300" y="322" width="320" height="24" rx="12" fill="url(#bar)"/>
<text x="632" y="340" font-size="15" fill="#9fb3c8">9%</text>
<text x="284" y="373" font-size="17" text-anchor="end">NOAA GFS</text>
<rect x="300" y="356" width="640" height="24" rx="12" fill="#ffffff" fill-opacity="0.07"/>
<rect x="300" y="356" width="320" height="24" rx="12" fill="url(#bar)"/>
<text x="632" y="374" font-size="15" fill="#9fb3c8">9%</text>
<text x="284" y="407" font-size="17" text-anchor="end">UK Met Office</text>
<rect x="300" y="390" width="640" height="24" rx="12" fill="#ffffff" fill-opacity="0.07"/>
<rect x="300" y="390" width="320" height="24" rx="12" fill="url(#bar)"/>
<text x="632" y="408" font-size="15" fill="#9fb3c8">9%</text>
<text x="284" y="441" font-size="17" text-anchor="end">Météo-France</text>
<rect x="300" y="424" width="640" height="24" rx="12" fill="#ffffff" fill-opacity="0.07"/>
<rect x="300" y="424" width="213" height="24" rx="12" fill="url(#bar)"/>
<text x="525" y="442" font-size="15" fill="#9fb3c8">6%</text>
<text x="284" y="475" font-size="17" text-anchor="end">Canada GEM</text>
<rect x="300" y="458" width="640" height="24" rx="12" fill="#ffffff" fill-opacity="0.07"/>
<rect x="300" y="458" width="213" height="24" rx="12" fill="url(#bar)"/>
<text x="525" y="476" font-size="15" fill="#9fb3c8">6%</text>
<text x="48" y="520" font-size="15" fill="#9fb3c8">An illustration of the method, not a screenshot or a measurement. The order is an assumption until forecasts have been scored against station readings;</text>
<text x="48" y="542" font-size="15" fill="#9fb3c8">then each weight is scaled by how close that source came, limited to four times up or down. The app always shows the weights it actually used.</text>
</g></svg>